<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | BookNook'">BookNook</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script defer th:src="@{/js/main.js}"></script>
</head>

<body>

<header th:fragment="header(activePage)" class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">B</span> BookNook
        </a>
        <nav class="main-nav">
            <a th:href="@{/}" th:classappend="${activePage == 'home'} ? 'active'">Home</a>
            <a th:href="@{/books}" th:classappend="${activePage == 'books'} ? 'active'">Browse Books</a>
            <div class="nav-group" th:if="${categories != null && !categories.isEmpty()}">
                <span class="nav-label">Categories</span>
                <div class="nav-dropdown">
                    <a th:each="cat : ${categories}" th:href="@{/books(categoryId=${cat.id})}"
                       th:text="${cat.name}">Category</a>
                </div>
            </div>
        </nav>
    </div>
</header>

<footer th:fragment="footer" class="site-footer">
    <div class="container">
        <p>&copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> BookNook. A Spring Boot bookstore demo.</p>
    </div>
</footer>

</body>
</html>
